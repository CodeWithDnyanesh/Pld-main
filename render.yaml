services:
  # FastAPI backend -> https://api.panduranglanddevelopers.com
  - type: web
    name: pld-api
    runtime: python
    rootDir: Pld-main/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    domains:
      - api.panduranglanddevelopers.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: pandurang_land
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://www.panduranglanddevelopers.com,https://panduranglanddevelopers.com

  # React frontend -> https://www.panduranglanddevelopers.com
  - type: web
    name: pld-web
    runtime: static
    rootDir: Pld-main/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    domains:
      - www.panduranglanddevelopers.com
      - panduranglanddevelopers.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://api.panduranglanddevelopers.com
      - key: CI
        value: "false"
